context:
  name: mgclient
  version: "1.8.0"
  m2: ${{ "" if unix else "m2-" }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/memgraph/mgclient/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b5a892fd4db905acf8fb709b696e0606ea790986714f8ac0e8eda66fa973666c
  patches:
    - if: not unix
      then:
        - disable-static-build.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - binutils
    - cmake >3.10
    - ninja
    - ${{ m2 }}sed
  host:
    - openssl
  run:
    - openssl
  run_exports:
    - ${{ pin_subpackage('mgclient', upper_bound='x.x') }}

tests:
  - package_contents:
      strict: true
      include:
        - mgclient.h
        - mgclient-export.h
      lib:
        - if: unix
          then: libmgclient
          else:
            - mgclient.dll
            - mgclient.lib
      files:
        - if: not unix
          then: Library/bin/mgclient.dll

about:
  homepage: https://github.com/memgraph/mgclient
  summary: 'C/C++ Memgraph Client'
  description: |
    mgclient is a C library interface for Memgraph database.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/memgraph/mgclient

extra:
  recipe-maintainers:
    - MementoRC
